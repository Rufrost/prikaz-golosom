<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Приказ голосом</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f5f7;
    --panel: #ffffff;
    --text: #1c1f26;
    --muted: #6b7280;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --danger: #dc2626;
    --border: #e5e7eb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 20px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 {
    font-size: 18px;
    margin: 0;
  }
  .header-actions {
    display: flex;
    gap: 4px;
  }
  .gear {
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
    color: var(--muted);
  }
  .gear:hover { color: var(--text); }
  main {
    flex: 1;
    padding: 8px 20px 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .record-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .record-buttons {
    display: flex;
    gap: 28px;
    align-items: flex-end;
  }
  .record-btn-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .btn-caption {
    font-size: 11px;
    color: var(--muted);
  }
  #recordBtn {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 32px;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  #recordBtn:hover { background: var(--accent-hover); }
  #recordBtn:active { transform: scale(0.96); }
  #recordBtn.recording {
    background: var(--danger);
    animation: pulse 1.4s infinite;
  }
  #appendBtn {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: white;
    color: var(--accent);
    font-size: 22px;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  #appendBtn:hover { background: #f0f0f0; }
  #appendBtn:active { transform: scale(0.96); }
  #appendBtn.recording {
    background: var(--danger);
    color: white;
    border-color: var(--danger);
    animation: pulse 1.4s infinite;
  }
  #recordBtn:disabled, #appendBtn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    animation: none;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(220,38,38,0.4); }
    70% { box-shadow: 0 0 0 16px rgba(220,38,38,0); }
    100% { box-shadow: 0 0 0 0 rgba(220,38,38,0); }
  }
  #timer {
    font-size: 22px;
    font-variant-numeric: tabular-nums;
    font-family: "Consolas", monospace;
    color: var(--text);
    min-height: 26px;
  }
  #timer.active { color: var(--danger); }
  #cancelSendBtn {
    border: 1px solid var(--danger);
    color: var(--danger);
    background: white;
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  #cancelSendBtn:hover { background: #fee2e2; }
  #status {
    font-size: 13px;
    color: var(--muted);
    min-height: 18px;
  }
  .token-stats {
    display: flex;
    gap: 16px;
    justify-content: center;
    font-size: 12px;
    color: var(--muted);
  }
  .token-stats b { color: var(--text); }
  .result-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .result-panel label {
    font-size: 13px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .label-actions {
    display: flex;
    gap: 8px;
  }
  #result {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    font-size: 14px;
    font-family: inherit;
  }
  .mini-btn {
    border: 1px solid var(--border);
    background: white;
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  .mini-btn:hover { background: #f0f0f0; }
  .mini-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    display: none;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--panel);
    border-radius: 12px;
    padding: 20px 24px;
    width: 460px;
    max-height: 90vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .modal h2 { margin: 0 0 4px; font-size: 16px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 12px; color: var(--muted); }
  .field input, .field textarea {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 13px;
    font-family: inherit;
  }
  .field textarea { resize: vertical; }
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 8px;
  }
  .btn {
    border: none;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  .btn.primary { background: var(--accent); color: white; }
  .btn.primary:hover { background: var(--accent-hover); }
  .btn.secondary { background: #f0f0f0; color: var(--text); }

  .history-modal { width: 520px; }
  .history-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 50vh;
    overflow-y: auto;
  }
  .history-item {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
  }
  .history-item-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 6px;
    gap: 8px;
  }
  .history-item-type {
    font-weight: 600;
    color: var(--accent);
  }
  .history-item-text {
    font-size: 13px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .history-empty {
    font-size: 13px;
    color: var(--muted);
    text-align: center;
    padding: 20px 0;
  }
</style>
</head>
<body>
  <header>
    <h1>Приказ голосом</h1>
    <div class="header-actions">
      <button class="gear" id="historyBtn" title="История">🕘</button>
      <button class="gear" id="settingsBtn" title="Настройки">⚙</button>
    </div>
  </header>

  <main>
    <div class="record-panel">
      <div class="record-buttons">
        <div class="record-btn-group">
          <button id="recordBtn" title="Записать (заменит текст)">🎙</button>
          <span class="btn-caption">Записать</span>
        </div>
        <div class="record-btn-group">
          <button id="appendBtn" title="Дозаписать (добавит к тексту)">➕</button>
          <span class="btn-caption">Дозаписать</span>
        </div>
      </div>
      <div id="timer">00:00</div>
      <button id="cancelSendBtn" hidden>Отменить отправку</button>
      <div id="status">Нажмите, чтобы начать запись</div>
    </div>

    <div class="result-panel">
      <label>
        Транскрибация
        <span class="label-actions">
          <button class="mini-btn" id="checkErrorsBtn">Проверить на ошибки</button>
          <button class="mini-btn" id="copyBtn">Копировать</button>
        </span>
      </label>
      <textarea id="result" placeholder="Здесь появится текст после записи..."></textarea>
      <div class="token-stats">
        <span>Последний запрос: <b id="lastTokens">—</b></span>
        <span>За сессию: <b id="sessionTokens">0</b></span>
      </div>
    </div>
  </main>

  <div class="modal-overlay" id="settingsModal">
    <div class="modal">
      <h2>Настройки polza.ai</h2>
      <div class="field">
        <label>API-ключ</label>
        <input type="password" id="apiKey" placeholder="sk-..." />
      </div>
      <div class="field">
        <label>Base URL</label>
        <input type="text" id="baseUrl" placeholder="https://api.polza.ai/v1" />
      </div>
      <div class="field">
        <label>Голосовая модель (транскрибация)</label>
        <input type="text" id="model" placeholder="whisper-1" />
      </div>
      <div class="field">
        <label>Язык записи (необязательно, код ISO, напр. ru)</label>
        <input type="text" id="language" placeholder="ru" />
      </div>
      <div class="field">
        <label>Текстовая модель (проверка на ошибки)</label>
        <input type="text" id="textModel" placeholder="gpt-4o-mini" />
      </div>
      <div class="field">
        <label>Промпт для исправления ошибок</label>
        <textarea id="correctionPrompt" rows="4"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn secondary" id="closeSettings">Отмена</button>
        <button class="btn primary" id="saveSettings">Сохранить</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="historyModal">
    <div class="modal history-modal">
      <h2>История транскрибаций</h2>
      <div id="historyList" class="history-list"></div>
      <div class="modal-actions">
        <button class="btn secondary" id="clearHistoryBtn">Очистить историю</button>
        <button class="btn primary" id="closeHistory">Закрыть</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
